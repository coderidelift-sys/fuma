<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - FUMA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles/login.css">
</head>
<body>

  <div class="login-card">
    <div class="logo">FUMA</div>
    <h4 class="text-center mb-3">Login to Your Account</h4>
    <form>
      <div class="mb-3">
        <label class="form-label">Name / Email / WhatsApp</label>
        <input type="text" class="form-control" placeholder="Enter your name, email or WA number" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <div class="text-center mt-3 text-muted">
      Don't have an account? <a href="register.html">Register</a>
    </div>
  </div>

</body>
</html>
