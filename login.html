<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FUMA</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="text-center mb-4">
                <div class="logo">
                    <i class="fas fa-futbol"></i>
                    FUMA
                </div>
                <h4 class="mt-3">Welcome Back</h4>
                <p class="text-muted">Sign in to your account</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Email" required>
                    <label for="email">Email Address</label>
                </div>
                
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>
                
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">
                        Remember me
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    Sign In
                </button>
            </form>

            <!-- Demo Accounts -->
            <div class="demo-accounts">
                <h6 class="text-center mb-3">Demo Accounts</h6>
                <div class="row g-2">
                    <div class="col-12">
                        <button class="btn btn-outline-primary btn-sm w-100" onclick="fillDemoAccount('admin')">
                            <i class="fas fa-user-shield me-1"></i> Admin Demo
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-secondary btn-sm w-100" onclick="fillDemoAccount('manager')">
                            <i class="fas fa-user-tie me-1"></i> Manager
                        </button>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-outline-info btn-sm w-100" onclick="fillDemoAccount('viewer')">
                            <i class="fas fa-user me-1"></i> Viewer
                        </button>
                    </div>
                </div>
            </div>

            <!-- Register Link -->
            <div class="text-center mt-4">
                <p class="text-muted">
                    Don't have an account? 
                    <a href="register.html" class="text-decoration-none">Sign up here</a>
                </p>
            </div>

            <!-- Error/Success Messages -->
            <div id="messageContainer" class="mt-3"></div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/api-client.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
