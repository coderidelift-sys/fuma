<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - FUMA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles/register.css">
</head>
<body>

  <div class="register-card">
    <div class="logo">FUMA</div>
    <h4 class="text-center mb-3">Create Your Tournament Account</h4>
    <form>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" placeholder="Your full name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" class="form-control" placeholder="example@mail.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label">WhatsApp Number</label>
        <input type="text" class="form-control" placeholder="08xxxxxxxxxx" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" placeholder="Choose a secure password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>
    <div class="text-center mt-3 text-muted">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

</body>
</html>
